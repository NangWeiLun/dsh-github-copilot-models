# Publishes a release when the maintainer pushes a `v*` tag (docs/cicd.md sections 4 to 7).
# npm trusts this file through trusted publishing; no npm token is stored on GitHub.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      npm-tag: ${{ steps.plan.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: plan
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the version in package.json, $version."
            exit 1
          fi
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "::error::$name@$version is already on npm."
            exit 1
          fi
          case "$version" in
            *-*) npm_tag=next ;;
            *) npm_tag=latest ;;
          esac
          echo "Releasing $name@$version as npm tag $npm_tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm-tag=$npm_tag" >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: plan
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      release-dsh: ${{ needs.plan.outputs.npm-tag }}

  publish:
    name: Publish to npm and GitHub
    needs: [plan, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # No `registry-url`: it writes an .npmrc with `_authToken=${NODE_AUTH_TOKEN}`, and
      # any configured token, even an empty one, makes npm skip trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/changelog.ts notes "$VERSION" > "$RUNNER_TEMP/notes.md"
      - name: Update npm (trusted publishing needs 11.5.1 or later)
        run: npm install --global npm@latest && npm --version
      - name: Publish to npm
        env:
          NPM_TAG: ${{ needs.plan.outputs.npm-tag }}
        run: npm publish --registry=https://registry.npmjs.org --tag "$NPM_TAG"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NPM_TAG: ${{ needs.plan.outputs.npm-tag }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag)
          if [ "$NPM_TAG" = next ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"
